services:
  - type: web
    name: style-atlas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4173
      - key: BILLING_REQUIRED
        value: false
      - key: BILLING_DATABASE_PATH
        value: /tmp/style-atlas.sqlite
      - key: RUNWARE_API_KEY
        sync: false
      - key: RUNWARE_BASE_URL
        value: https://api.runware.ai/v1
      - key: RUNWARE_MODELS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://styleatlas.art,https://www.styleatlas.art,https://liuyahui59.github.io
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PINGXX_SECRET_KEY
        sync: false
      - key: PINGXX_APP_ID
        sync: false
      - key: PINGXX_PUBLIC_KEY
        sync: false
